<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .captcha-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        #video-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="captcha-box" id="captcha">
        <h2>Подтвердите, что вы не робот</h2>
        <p>Для получения доступа к файлу нажмите кнопку ниже:</p>
        <!-- Текст на кнопке изменен под вашу новую версию -->
        <button onclick="startRickRoll()">Я не робот (Подтвердить)</button>
    </div>

    <div id="video-container">
        <!-- Заменили путь на глобальную архивную копию видео, которая гарантированно прогрузится -->
        <video id="rickview" src="https://archive.org" preload="auto" playsinline></video>
    </div>

    <script>
        function startRickRoll() {
            document.getElementById('captcha').style.display = 'none';
            const container = document.getElementById('video-container');
            container.style.display = 'block';

            const video = document.getElementById('rickview');
            
            // Пытаемся развернуть на весь экран
            if (container.requestFullscreen) { container.requestFullscreen(); }
            else if (container.webkitRequestFullscreen) { container.webkitRequestFullscreen(); }

            // Выкручиваем громкость плеера на максимум и запускаем
            video.volume = 1.0; 
            video.play().catch(function(error) {
                console.log("Ошибка воспроизведения: ", error);
            });
        }
    </script>
</body>
</html>
